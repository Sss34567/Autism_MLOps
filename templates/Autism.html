<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autism Screening</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-4" style="max-width:720px">
  <form action="/" method="post">
    <legend>Autism Screening Form</legend>

    <div class="row">
      {% for i in range(1, 11) %}
      <div class="col-6 mb-3">
        <label for="A{{i}}_Score">A{{i}} Score</label>
        <select class="form-control" id="A{{i}}_Score" name="A{{i}}_Score" required>
          <option value="" disabled selected>Select</option>
          <option>0</option>
          <option>1</option>
        </select>
      </div>
      {% endfor %}
    </div>

    <div class="mb-3">
      <label for="age">Age</label>
      <input type="number" class="form-control" id="age" name="age" min="1" max="100" required>
    </div>

    <div class="mb-3">
      <label for="ethnicity">Ethnicity</label>
      <select class="form-control" id="ethnicity" name="ethnicity" required>
        <option value="" disabled selected>Select Ethnicity</option>
        <option>White-European</option>
        <option>Asian</option>
        <option>Black</option>
        <option>Latino</option>
        <option>Hispanic</option>
        <option>Middle Eastern </option>
        <option>South Asian</option>
        <option>Turkish</option>
        <option>Pasifika</option>
        <option>Others</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="jaundice">Jaundice at birth</label>
      <select class="form-control" id="jaundice" name="jaundice" required>
        <option value="" disabled selected>Select</option>
        <option>no</option>
        <option>yes</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="austim">Family member with autism</label>
      <select class="form-control" id="austim" name="austim" required>
        <option value="" disabled selected>Select</option>
        <option>no</option>
        <option>yes</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="contry_of_res">Country of residence</label>
      <input type="text" class="form-control" id="contry_of_res" name="contry_of_res" placeholder="e.g. United States" required>
    </div>

    <input class="btn btn-primary" type="submit" value="Predict">
  </form>

  <div class="text-center mt-4">
    <h3>Result: {{ context }}</h3>
    <p class="text-muted small">This is a screening tool, not a medical diagnosis.</p>
  </div>
</div>
</body>
</html>
