grid_search:
  class: GridSearchCV
  module: sklearn.model_selection
  params:
    cv: 3
    verbose: 2

model_selection:
  module_0:
    class: CatBoostClassifier
    module: catboost
    params:
      iterations: 150
      depth: 5
      learning_rate: 0.05
      l2_leaf_reg: 7
      random_state: 42
      verbose: 0
    search_param_grid:
      iterations: [150, 300]
      depth: [4, 5, 6]
      learning_rate: [0.05, 0.1]
      l2_leaf_reg: [3, 5, 7]

  module_1:
    class: GradientBoostingClassifier
    module: sklearn.ensemble
    params:
      n_estimators: 200
      max_depth: 5
      learning_rate: 0.1
      subsample: 0.9
      random_state: 42
    search_param_grid:
      n_estimators: [100, 200]
      max_depth: [3, 5, 7]
      learning_rate: [0.1, 0.2]
      subsample: [0.8, 0.9]

  module_2:
    class: RandomForestClassifier
    module: sklearn.ensemble
    params:
      n_estimators: 50
      max_depth: 15
      max_features: log2
      random_state: 42
    search_param_grid:
      n_estimators: [50, 100, 200]
      max_depth: [10, 15, 20]
      max_features: [sqrt, log2]
